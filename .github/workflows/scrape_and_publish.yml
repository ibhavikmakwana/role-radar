name: RoleRadar Multi-ATS Scraper & Publish

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Multi-ATS Scraper
        run: |
          python scripts/scraper.py

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/feed.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto-update multi-ats job feed [skip ci]" && git push)
